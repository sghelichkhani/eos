name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libexpat1-dev

    - name: Run install-minimal.sh (no MPI)
      run: |
        chmod +x install-minimal.sh
        ./install-minimal.sh --prefix=${{ github.workspace }}/_install --no-mpi --jobs=$(nproc)

    - name: Run dotnet tests
      run: |
        export PATH="${{ github.workspace }}/_build/dotnet:$PATH"
        export DOTNET_ROOT="${{ github.workspace }}/_build/dotnet"
        export LD_LIBRARY_PATH="${{ github.workspace }}/_install/lib/eos"
        dotnet test EoS.sln -c Release --verbosity normal --framework net8.0

    - name: Run integration test (opti+prop pipeline)
      run: |
        chmod +x tests/integration-test.sh
        tests/integration-test.sh ${{ github.workspace }}/_install/bin/eos
